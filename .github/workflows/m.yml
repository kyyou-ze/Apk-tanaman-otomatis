name: Unzip Project

on:
  push:
    branches:
      - main # Ganti ke master jika branch utamamu bernama master
    paths:
      - "*.zip" # Hanya pantau zip di root repo agar lebih aman
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Path file zip yang mau diekstrak (relatif dari root repo)"
        required: false
        default: "VTuberApp.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Tentukan, ekstrak, dan ratakan file zip
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TARGET_ZIPS="${{ github.event.inputs.zip_file }}"
          else
            # Cari semua file .zip yang ada di root repo
            TARGET_ZIPS=$(find . -maxdepth 1 -name "*.zip")
          fi

          if [ -z "$TARGET_ZIPS" ]; then
            echo "Tidak ada file zip ditemukan."
            exit 0
          fi

          for zip in $TARGET_ZIPS; do
            if [ -f "$zip" ]; then
              echo "Mengekstrak $zip..."
              
              # 1. Buat folder sementara agar tidak bentrok dengan folder .github atau .git
              TEMP_DIR=$(mktemp -d)
              
              # 2. Ekstrak ke folder sementara sambil mengabaikan file sampah OS dan .git
              unzip -o "$zip" -d "$TEMP_DIR" -x "__MACOSX/*" "*.DS_Store" "Thumbs.db" ".git/*" ".github/*"
              
              # 3. Ratakan semua file dari folder sementara ke root (menimpa file lama yang sama)
              find "$TEMP_DIR" -type f -exec mv -f {} . \;
              
              # 4. Bersihkan folder sementara dan file zip asli
              rm -rf "$TEMP_DIR"
              rm -f "$zip"
              
              echo "EXTRACTED=true" >> "$GITHUB_ENV"
            fi
          done

      - name: Commit hasil ekstrak
        if: env.EXTRACTED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-extract and flatten zip archive"
          file_pattern: "."
          
